<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add & Remove Elements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#btn1").click(function () {
                $("#list").append("<li class='list-group-item'>New item</li>");
            })
            $("#btn2").click(function () {
                $("#list li").last().remove()
            })
            $("#btn3").click(function () {
                $("#list").prepend("<li class='list-group-item'>New item</li>")
            })
        })
    </script>
</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">Add & Remove Elements</span>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a href="index.html" class="nav-link">Task 0</a></li>
                <li class="nav-item"><a href="task1.html" class="nav-link">Task 1</a></li>
                <li class="nav-item"><a href="task2.html" class="nav-link">Task 2</a></li>
                <li class="nav-item"><a href="task3.html" class="nav-link">Task 3</a></li>
                <li class="nav-item"><a href="task4.html" class="nav-link">Task 4</a></li>
                <li class="nav-item"><a href="task5.html" class="nav-link">Task 5</a></li>
                <li class="nav-item"><a href="task6.html" class="nav-link">Task 6</a></li>
                <li class="nav-item"><a href="task7.html" class="nav-link">Task 7</a></li>
                <li class="nav-item"><a href="task8.html" class="nav-link">Task 8</a></li>
                <li class="nav-item"><a href="task9.html" class="nav-link">Task 9</a></li>
                <li class="nav-item"><a href="task10.html" class="nav-link">Task 10</a></li>
                <li class="nav-item"><a href="task11.html" class="nav-link">Task 11</a></li>
            </ul>
        </div>
    </nav>
    <div class="container my-5" style="max-width: 720px;">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                    <button type="button" id="btn3" class="btn btn-secondary">Add item (prepend)</button>
                    <button type="button" id="btn1" class="btn btn-primary">Add item (append)</button>
                    <button type="button" id="btn2" class="btn btn-danger">Remove item</button>
                </div>

                <ul id="list" class="list-group text-start">
                    <li class="list-group-item">Item</li>
                </ul>

            </div>
        </div>
    </div>
</body>

</html>
