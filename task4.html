<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slide Methods</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#btnUp").click(function () {
                $("#panel").slideUp("slow");
            });
            $("#btnDown").click(function () {
                $("#panel").slideDown("slow");
            });
            $("#btnToggle").click(function () {
                $("#panel").slideToggle("slow");
            });
        })
    </script>

</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">Slide Methods</span>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a href="index.html" class="nav-link">Task 0</a></li>
                <li class="nav-item"><a href="task1.html" class="nav-link">Task 1</a></li>
                <li class="nav-item"><a href="task2.html" class="nav-link">Task 2</a></li>
                <li class="nav-item"><a href="task3.html" class="nav-link">Task 3</a></li>
                <li class="nav-item"><a href="task4.html" class="nav-link">Task 4</a></li>
                <li class="nav-item"><a href="task5.html" class="nav-link">Task 5</a></li>
                <li class="nav-item"><a href="task6.html" class="nav-link">Task 6</a></li>
                <li class="nav-item"><a href="task7.html" class="nav-link">Task 7</a></li>
                <li class="nav-item"><a href="task8.html" class="nav-link">Task 8</a></li>
                <li class="nav-item"><a href="task9.html" class="nav-link">Task 9</a></li>
                <li class="nav-item"><a href="task10.html" class="nav-link">Task 10</a></li>
                <li class="nav-item"><a href="task11.html" class="nav-link">Task 11</a></li>
            </ul>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 520px;">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="py-3">
                    <button id="btnUp" class="btn btn-primary">Slide Up</button>
                    <button id="btnDown" class="btn btn-secondary">Slide Down</button>
                    <button id="btnToggle" class="btn btn-success">Slide Toggle</button>

                    <div id="panel" class="mt-3 p-4 border bg-light">
                        Collapsible panel content
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
