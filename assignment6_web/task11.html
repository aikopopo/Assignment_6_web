<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bouncing Ball</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {

            function bounce() {
                $("#ball")
                    .animate({ left: "250px", top: "240px" }, 600)   
                    .animate({ left: "500px", top: "0px" }, 600)     
                    .animate({ left: "250px", top: "240px" }, 600)   
                    .animate({ left: "0px", top: "0px" }, 600, bounce); 
            }

            $("#btn1").click(function () {
                $("#ball").stop(true);
                bounce();
            });

            $("#btn2").click(function () {
                $("#ball").stop(true);
            });
        });
    </script>
</head>

<body class="bg-light">
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">Bouncing Ball</span>

            <ul class="navbar-nav flex-row flex-wrap gap-3">
                <li class="nav-item"><a href="index.html" class="nav-link">Task 0</a></li>
                <li class="nav-item"><a href="task1.html" class="nav-link">Task 1</a></li>
                <li class="nav-item"><a href="task2.html" class="nav-link">Task 2</a></li>
                <li class="nav-item"><a href="task3.html" class="nav-link">Task 3</a></li>
                <li class="nav-item"><a href="task4.html" class="nav-link">Task 4</a></li>
                <li class="nav-item"><a href="task5.html" class="nav-link">Task 5</a></li>
                <li class="nav-item"><a href="task6.html" class="nav-link">Task 6</a></li>
                <li class="nav-item"><a href="task7.html" class="nav-link">Task 7</a></li>
                <li class="nav-item"><a href="task8.html" class="nav-link">Task 8</a></li>
                <li class="nav-item"><a href="task9.html" class="nav-link">Task 9</a></li>
                <li class="nav-item"><a href="task10.html" class="nav-link">Task 10</a></li>
                <li class="nav-item"><a href="task11.html" class="nav-link active">Task 11</a></li>
            </ul>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 720px;">
        <div class="card shadow">
            <div class="card-body p-4 text-center">

                <button id="btn1" class="btn btn-primary mb-3">Start</button>
                <button id="btn2" class="btn btn-danger mb-3">Stop</button>

                <div class="border rounded bg-white text-start"
                     style="position: relative; height: 300px; overflow: hidden;">
                    <div id="ball"
                         style="position: absolute; left: 0; top: 0;
                                width: 60px; height: 60px;
                                border-radius: 50%; background: crimson;"></div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
