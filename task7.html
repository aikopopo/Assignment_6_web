<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Interaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#name").on("input", function () {
                $("#nameOut").text($(this).val());
            });
            $("#email").on("input", function () {
                $("#emailOut").text($(this).val());
            });
            $("input").focus(function () {
                $(this).css("background-color", "lightblue");
            });
            $("input").blur(function () {
                $(this).css("background-color", "grey");
            });
        });
    </script>

</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">Form Interaction</span>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item"><a href="index.html" class="nav-link">Task 0</a></li>
                <li class="nav-item"><a href="task1.html" class="nav-link">Task 1</a></li>
                <li class="nav-item"><a href="task2.html" class="nav-link">Task 2</a></li>
                <li class="nav-item"><a href="task3.html" class="nav-link">Task 3</a></li>
                <li class="nav-item"><a href="task4.html" class="nav-link">Task 4</a></li>
                <li class="nav-item"><a href="task5.html" class="nav-link">Task 5</a></li>
                <li class="nav-item"><a href="task6.html" class="nav-link">Task 6</a></li>
                <li class="nav-item"><a href="task7.html" class="nav-link">Task 7</a></li>
                <li class="nav-item"><a href="task8.html" class="nav-link">Task 8</a></li>
                <li class="nav-item"><a href="task9.html" class="nav-link">Task 9</a></li>
                <li class="nav-item"><a href="task10.html" class="nav-link">Task 10</a></li>
                <li class="nav-item"><a href="task11.html" class="nav-link">Task 11</a></li>
            </ul>
        </div>
    </nav>
    <div class="container my-5" style="max-width: 720px;">
        <div class="card shadow">
            <div class="card-body p-4 p-md-5">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>
                </form>

                <div class="p-3 rounded" style="background-color: #eaf6fb;">
                    <h5 class="mb-3">You typed:</h5>
                    <div class="mb-2">
                        <span>Name:</span>
                        <b id="nameOut"></b>
                    </div>
                    <div>
                        <span>Email</span>
                        <b id="emailOut"></b>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
</body>

</html>
